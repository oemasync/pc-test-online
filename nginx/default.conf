server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml;

    # Security headers (applied at server level; re-declared in locations that add headers)
    add_header Content-Security-Policy "default-src 'self'; worker-src 'self' blob:; media-src 'self' blob: mediastream:; img-src 'self' data: blob:" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), speaker-selection=(self), gamepad=(self), fullscreen=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self), ambient-light-sensor=(self), battery=(self)" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Health check
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Long immutable caching for built assets
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; worker-src 'self' blob:; media-src 'self' blob: mediastream:; img-src 'self' data: blob:" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), speaker-selection=(self), gamepad=(self), fullscreen=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self), ambient-light-sensor=(self), battery=(self)" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files $uri =404;
    }

    # Never cache the SPA entry point
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; worker-src 'self' blob:; media-src 'self' blob: mediastream:; img-src 'self' data: blob:" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), speaker-selection=(self), gamepad=(self), fullscreen=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self), ambient-light-sensor=(self), battery=(self)" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
