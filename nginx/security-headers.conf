# Security headers shared by all responses.
# Included from nginx/default.conf (server and per-location contexts).
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; worker-src 'self' blob:; media-src 'self' blob: mediastream:; img-src 'self' data: blob:" always;
add_header Permissions-Policy "camera=(self), microphone=(self), gamepad=(self), fullscreen=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self)" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
